# =============================================================================
# Vid-Bolt GPU API - Docker Compose Configuration
# =============================================================================
# Usage:
#   docker compose up -d          # Start with GPU support
#   docker compose logs -f        # View logs
#   docker compose down           # Stop
# =============================================================================

services:
  vid-bolt-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vid-bolt-gpu-api:latest
    container_name: vid-bolt-gpu

    # GPU Configuration (requires NVIDIA Container Toolkit)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Port mapping
    ports:
      - "8000:8000"

    # Environment variables
    environment:
      - MOCK_MODE=${MOCK_MODE:-false}
      - API_KEY=${API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - PUBLIC_ASSET_BASE_URL=${PUBLIC_ASSET_BASE_URL:-https://assets.vidbolt.app}
      # R2 Storage
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-}
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL:-}
      # HuggingFace
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/app/models

    # Volume mounts
    volumes:
      # Models directory - persist across container restarts
      - ./models:/app/models
      # Optional: mount local app for development
      - ./app:/app/app

    # Restart policy
    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # =============================================================================
  # Optional: Development profile with hot-reload
  # =============================================================================
  # docker compose --profile dev up

  vid-bolt-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
    image: vid-bolt-gpu-api:dev
    container_name: vid-bolt-gpu-dev

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    ports:
      - "8000:8000"

    environment:
      - MOCK_MODE=true
      - API_KEY=dev-key
      - LOG_LEVEL=DEBUG

    volumes:
      - ./models:/app/models
      - ./app:/app/app # Hot-reload app changes

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
